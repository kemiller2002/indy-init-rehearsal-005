<!doctype html>
<html lang="en" data-ef-brand="causa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- The page runs only its own code and the .NET WebAssembly application; the only remotes it may reach are
       GitHub's API and, when the person asks for AI proposals with their own key, the Anthropic API. No inline script, no eval, no base element. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.anthropic.com; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title data-text="page.title">Causa</title>
  <link rel="icon" href="causa-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/forma/all.css">
  <link rel="stylesheet" href="causa.css">
  <!-- Folio print primitives apply only when printing; on screen the report is a styled preview. -->
  <link rel="stylesheet" href="vendor/folio/print.css" media="print">
  <script type="module" src="main.js"></script>
</head>
<body class="ef-site causa" data-bind-data-text-size="text.size" data-bind-data-motion="motion" data-bind-data-screen="screen" data-bind-data-percepta-state="percepta.state" data-bind-data-secret-epoch="secrets.epoch">
  <p id="causa-ready" class="ef-visually-hidden" role="status" tabindex="-1"></p>
  <a class="ef-skip-link" href="#causa-main">Skip to main content</a>

  <header class="ef-site-header causa-masthead" data-ef-tone="inverse">
    <div class="ef-site-header__inner">
      <div class="ef-site-header__identity">
        <img class="causa-mark-img" src="causa-icon.svg" alt="">
        <span class="ef-site-header__name">Causa</span>
        <span class="ef-site-header__tagline">Root-cause investigation</span>
      </div>
      <nav class="causa-primary-nav" aria-label="Primary">
        <ul>
          <template data-each="nav" data-key="id">
            <li><a data-bind-href="href" data-bind-aria-current="current" data-text="label"></a></li>
          </template>
        </ul>
      </nav>
      <template data-if="data.fixture"><p class="causa-tag causa-fixture-mode" role="status" data-percepta-observation="data-mode">Fixture data: synthetic, not GitHub</p></template>
      <p class="causa-connection" aria-live="polite"><span class="ef-visually-hidden">Data repository: </span><span data-text="connection.label">Not connected</span></p>
      <template data-if="connected">
        <button type="button" class="ef-button causa-disconnect" data-event="disconnect">Disconnect</button>
      </template>
    </div>
  </header>

  <!-- WASM-LOAD-001..006: a static, accessible starting state shown before the application runs; main.js removes it
       only once the kernel reports the application running. -->
  <div id="causa-boot" class="causa-boot" role="status" aria-live="polite" data-state="starting">
    <img class="causa-boot__mark" src="causa-icon.svg" alt="Causa">
    <span class="causa-boot__spinner" aria-hidden="true"></span>
    <p id="causa-boot-label" class="causa-boot__label">Starting Causa…</p>
    <p id="causa-boot-detail" class="causa-boot__detail">Loading the investigation workspace. Nothing is sent anywhere until you connect.</p>
  </div>

  <main id="causa-main" class="ef-site__main causa-main" tabindex="-1">
    <template data-if="notice.alert">
      <div class="ef-alert causa-notice" role="alert" data-bind-data-tone="notice.tone">
        <p class="causa-notice__text" data-text="notice.text"></p>
        <button type="button" class="ef-button causa-notice__dismiss" data-event="dismiss">Dismiss</button>
      </div>
    </template>
    <template data-if="notice.status">
      <div class="ef-alert causa-notice" role="status" data-bind-data-tone="notice.tone">
        <p class="causa-notice__text" data-text="notice.text"></p>
        <button type="button" class="ef-button causa-notice__dismiss" data-event="dismiss">Dismiss</button>
      </div>
    </template>

    <!-- UI-004-O3: a destructive or irreversible action waits here for an explicit confirmation. -->
    <template data-if="confirm.show">
      <div id="causa-confirm" class="ef-dialog causa-confirm" role="alertdialog" aria-modal="false" aria-labelledby="causa-confirm-title" aria-describedby="causa-confirm-text">
        <h2 id="causa-confirm-title">Please confirm</h2>
        <p id="causa-confirm-text" data-text="confirm.text"></p>
        <button type="button" class="ef-button" data-ef-variant="primary" id="causa-confirm-yes" data-event="confirm-yes">Yes, continue</button>
        <button type="button" class="ef-button" data-event="confirm-no">Cancel</button>
      </div>
    </template>

    <!-- Disconnected: the empty workspace and the explicit Connect action (UI-001-O1, EXT-DATA-002). -->
    <template data-if="screen.connect">
      <section class="causa-connect" aria-labelledby="connect-heading" data-percepta-screen="connect">
        <div class="ef-empty-state causa-empty">
          <h1 id="connect-heading">Connect a data repository</h1>
          <p>Causa starts empty. It shows no investigation until you connect to a GitHub repository.</p>
          <template data-if="route.pending">
            <p class="causa-hint">Connect to open the page you asked for.</p>
          </template>
        </div>
        <template data-if="connection.hasDetail">
          <p class="causa-muted" role="status" data-text="connection.detail"></p>
        </template>
        <template data-if="connect.failed">
          <p class="ef-alert causa-notice" data-tone="warning" role="alert" data-text="connect.failure"></p>
        </template>
        <form class="ef-form causa-form" data-event="connect" data-clear-secrets aria-describedby="token-help">
          <div class="ef-field">
            <label class="ef-field__label" id="token-label" for="token">Fine-grained GitHub token</label>
            <input id="token" aria-labelledby="token-label" class="causa-input" type="password" autocomplete="off" spellcheck="false" required data-event="token">
            <p id="token-help" class="ef-field__description">Kept in this page's memory only: never stored in the browser, never written to the repository or logs. Reloading the page forgets it.</p>
          </div>
          <div class="ef-field">
            <label class="ef-field__label" id="repository-label" for="repository">Repository (owner/name)</label>
            <input id="repository" aria-labelledby="repository-label" class="causa-input" type="text" autocomplete="off" spellcheck="false" required data-event="repository" data-on="input" data-bind-value="draft.repository">
          </div>
          <div class="causa-form__row">
            <div class="ef-field">
              <label class="ef-field__label" id="branch-label" for="branch">Branch</label>
              <input id="branch" aria-labelledby="branch-label" class="causa-input" type="text" autocomplete="off" spellcheck="false" required data-event="branch" data-on="input" data-bind-value="draft.branch">
            </div>
            <div class="ef-field">
              <label class="ef-field__label" id="workspace-label" for="workspace">Workspace</label>
              <input id="workspace" aria-labelledby="workspace-label" class="causa-input" type="text" autocomplete="off" spellcheck="false" required data-event="workspace" data-on="input" data-bind-value="draft.workspace">
            </div>
          </div>
          <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="connect.busy">Connect</button>
        </form>
      </section>
    </template>

    <!-- Investigations (UI-001, UI-022). -->
    <template data-if="screen.list">
      <section class="causa-dashboard" aria-labelledby="dashboard-heading" data-percepta-screen="investigations">
        <div class="causa-heading-row">
          <h1 id="dashboard-heading">Investigations</h1>
          <a class="ef-button causa-link-button" data-ef-variant="primary" href="#/investigations/new">New investigation</a>
        </div>
        <template data-if="list.loading"><p class="causa-muted" role="status">Loading investigations…</p></template>
        <template data-if="list.failed"><p class="ef-alert causa-notice" data-tone="danger" role="alert" data-text="list.failure"></p></template>
        <template data-if="list.empty"><p class="ef-empty-state">No investigations yet.</p></template>
        <!-- The catalog (stream ux, UI-001, UI-022): domain status, latest activity, counts the domain holds, the next
             action only when the F# policy allows one, and the reference id for provenance. -->
        <div class="causa-catalog-tools ef-collection-toolbar">
          <label class="ef-field__label" for="catalog-sort">Sort investigations by</label>
          <select id="catalog-sort" class="causa-input" data-event="catalog-sort" data-bind-value="catalog.sort">
            <template data-each="catalog.sorts" data-key="id"><option data-bind-value="value" data-text="label"></option></template>
          </select>
        </div>
        <ul class="causa-cards" aria-label="Investigations">
          <template data-each="cards" data-key="id">
            <li class="causa-card ef-surface" data-bind-data-selected="selected" data-bind-aria-current="selected" tabindex="-1">
              <h2 class="causa-card__title" data-text="title"></h2>
              <p class="causa-card__lifecycle">Status: <span class="causa-tag" data-bind-data-tone="tone" data-text="status"></span> <span class="causa-muted" data-text="kind"></span></p>
              <p class="causa-card__status causa-card__activity" data-text="activity"></p>
              <p class="causa-card__status causa-card__counts"><span data-text="questions"></span> · <span data-text="evidence"></span> · <span data-text="hypotheses"></span> · <span data-text="contradictions"></span></p>
              <template data-if="hasNext"><p class="causa-card__next" data-text="next"></p></template>
              <p><a class="ef-button causa-link-button causa-card__open" data-ef-variant="primary" data-bind-href="href" data-bind-aria-label="openLabel">Open investigation</a></p>
              <p class="causa-card__reference causa-muted"><span class="ef-identifier" data-text="reference"></span></p>
            </li>
          </template>
        </ul>
      </section>
    </template>

    <template data-if="screen.new">
      <section aria-labelledby="new-heading" data-percepta-screen="investigation-start">
        <h1 id="new-heading" data-percepta-observation="desktop-reference-semantic-priority">New investigation</h1>
        <div class="causa-attention" data-percepta-observation="desktop-reference-blocked-state">
          <strong data-percepta-observation="narrow-phone-blocked-state">Open questions:</strong>
          <span data-text="ws.questions" data-percepta-observation="ipad-portrait-blocked-state"></span>
          <template data-if="ws.material"><span class="causa-attention__question" data-text="ws.first" data-percepta-observation="blocker-visible"></span></template>
          <template data-if="ws.material"><span class="causa-attention__blocked" data-text="ws.provisional" data-percepta-observation="no-false-authority"></span></template>
          <span data-text="start.availability" data-percepta-observation="ipad-landscape-blocked-state"></span>
        </div>
        <ul class="causa-list">
          <template data-each="wsBlockers" data-key="id">
            <li class="causa-item causa-item--blocker" data-bind-id="anchor"><p data-text="question"></p><p class="causa-muted" data-text="materiality"></p></li>
          </template>
        </ul>
        <form class="ef-form causa-form" data-event="start">
          <fieldset class="causa-panel" data-percepta-region="problem-statement">
            <legend data-percepta-observation="ipad-portrait-semantic-priority">What happened?</legend>
            <div class="ef-field">
              <label class="ef-field__label" id="new-title-label" for="new-title">Title</label>
              <input id="new-title" aria-labelledby="new-title-label" class="causa-input" type="text" autocomplete="off" required data-event="title" data-on="input" data-bind-value="draft.title">
            </div>
            <div class="ef-field">
              <label class="ef-field__label" id="new-statement-label" for="new-statement" data-percepta-observation="ipad-landscape-semantic-priority">Problem statement: what was observed, when and with what impact</label>
              <textarea id="new-statement" aria-labelledby="new-statement-label" class="causa-input" rows="4" required data-event="statement" data-on="input" data-bind-value="draft.statement" aria-describedby="new-statement-help"></textarea>
              <p id="new-statement-help" class="ef-field__description" data-percepta-observation="narrow-phone-semantic-priority">Record what was observed. A first statement is not treated as a cause.</p>
            </div>
          </fieldset>
          <section class="causa-panel" aria-labelledby="new-destination" data-percepta-region="persistence-destination">
            <h2 id="new-destination">Where it will be saved</h2>
            <p data-text="destination"></p>
          </section>
          <div>
            <template data-if="start.legal">
              <button type="submit" class="ef-button" data-ef-variant="primary" data-percepta-capability="StartInvestigation" data-text="start.label"></button>
            </template>
            <template data-if="start.illegal"><div class="causa-capability">
              <button type="submit" class="ef-button" disabled data-percepta-capability="StartInvestigation" aria-describedby="start-reason" data-text="start.label"></button>
              <p id="start-reason" class="causa-capability__reason" data-percepta-unavailable-reason-for="StartInvestigation" data-text="start.reason"></p>
              <template data-if="start.hasBlocker">
                <a class="causa-related" data-bind-href="start.blockerHref" data-percepta-blocker-link-for="StartInvestigation">See the open question</a>
              </template>
            </div></template>
          </div>
        </form>
      </section>
    </template>

    <template data-if="screen.opening">
      <section aria-labelledby="opening-heading" data-percepta-screen="investigation-opening">
        <h1 id="opening-heading">Opening investigation</h1>
        <p role="status" class="causa-muted">Opening investigation…</p>
      </section>
    </template>

    <template data-if="screen.failed">
      <section aria-labelledby="failed-heading" data-percepta-screen="investigation-failed">
        <h1 id="failed-heading">This investigation could not be opened</h1>
        <p class="ef-alert causa-notice" data-tone="danger" role="alert" data-text="failed.text"></p>
        <p><a class="causa-back" href="#/investigations">Back to Investigations</a></p>
      </section>
    </template>

    <template data-if="screen.missing">
      <section aria-labelledby="missing-heading" data-percepta-screen="investigation-missing">
        <h1 id="missing-heading">Investigation not found</h1>
        <p>No investigation with this address exists in the connected repository. Nothing was changed.</p>
        <p><a class="causa-back" href="#/investigations">Back to Investigations</a></p>
      </section>
    </template>

    <template data-if="screen.notfound">
      <section aria-labelledby="notfound-heading" data-percepta-screen="not-found">
        <h1 id="notfound-heading">Page not found</h1>
        <p>This address does not match any page in Causa.</p>
        <p><a class="causa-back" href="#/investigations">Go to Investigations</a></p>
      </section>
    </template>

    <!-- An investigation: header, secondary navigation and one section (UI-025, UI-029-O2). -->
    <template data-if="screen.investigation">
      <div class="causa-investigation">
        <p><a class="causa-back" data-bind-href="inv.backHref">Investigations</a></p>
        <header class="causa-inv-header">
          <p class="causa-kind" data-text="inv.kind" data-percepta-observation="ipad-landscape-semantic-priority"></p>
          <h1 data-text="inv.title" data-percepta-observation="desktop-reference-semantic-priority"></h1>
          <p class="causa-inv-meta">Status: <span class="causa-tag" data-bind-data-tone="inv.tone" data-text="inv.status" data-percepta-observation="ipad-portrait-semantic-priority"></span> <span class="causa-muted" data-text="inv.version" data-percepta-observation="narrow-phone-semantic-priority"></span></p>
          <template data-if="findings.show"><p class="causa-findings"><span class="causa-label">Findings:</span> <span data-text="findings.text"></span></p></template>
          <!-- What blocks progress, in every section's primary flow (UI-032): counts and words, never colour alone. -->
          <div class="causa-attention" data-bind-data-tone="attention.tone" data-percepta-observation="desktop-reference-blocked-state">
            <strong data-percepta-observation="narrow-phone-blocked-state">Open questions:</strong>
            <span data-text="attention.questions" data-percepta-observation="ipad-portrait-blocked-state"></span>
            <template data-if="attention.material"><span class="causa-attention__question" data-text="attention.first" data-percepta-observation="blocker-visible"></span></template>
            <template data-if="attention.material"><span class="causa-attention__blocked" data-text="attention.provisional" data-percepta-observation="no-false-authority"></span></template>
            <template data-if="attention.blocked"><span class="causa-attention__blocked" data-text="attention.blockedText"></span></template>
            <a class="causa-related" data-bind-href="attention.href" data-percepta-observation="ipad-landscape-blocked-state">See open questions</a>
          </div>
        </header>
        <nav class="causa-sections" aria-label="Investigation sections">
          <ul>
            <template data-each="sections" data-key="id">
              <li><a data-bind-href="href" data-bind-aria-current="current" data-text="label"></a></li>
            </template>
          </ul>
        </nav>

        <template data-if="section.overview">
          <section class="causa-overview" aria-label="Overview" data-bind-data-percepta-screen="an.overview.screen">
            <h2>Overview</h2>
            <!-- Persistence conflict recovery (S23): both sides, what is pending, and the person's choice. -->
            <template data-if="an.conflict">
              <section class="causa-panel causa-conflict" aria-labelledby="cf-heading">
                <h3 id="cf-heading">Someone else changed this investigation in GitHub</h3>
                <div class="causa-overview-grid">
                  <div data-percepta-region="local-state"><h4>Your copy</h4><p data-text="an.conflict.local"></p></div>
                  <div data-percepta-region="remote-state"><h4>GitHub's copy</h4><p data-text="an.conflict.remote"></p></div>
                  <div data-percepta-region="pending-commands"><h4>Pending changes</h4><p data-text="an.conflict.pending"></p></div>
                  <div data-percepta-region="semantic-conflict"><h4>What differs</h4><p data-text="an.conflict.semantic"></p></div>
                </div>
                <div data-percepta-region="resolution"><h4>Choose what happens</h4>
                  <button type="button" class="ef-button" data-event="reload-remote">Reload the version in GitHub (keep my change)</button>
                  <button type="button" class="ef-button" data-event="discard-local">Discard my local change</button></div>
              </section>
            </template>
            <!-- Epistemic blocker detail (S08): the selected open question or contradiction, what waits on it, how it is resolved. -->
            <template data-if="an.blocker.show">
              <section class="causa-panel causa-blocker-detail" aria-labelledby="bd-heading">
                <h3 id="bd-heading">Open item in detail</h3>
                <div class="causa-overview-grid">
                  <div data-percepta-region="entity"><h4 data-text="an.blocker.kind"></h4><p data-text="an.blocker.text"></p>
                    <ul class="causa-list" aria-label="Evidence it concerns"><template data-each="an.blocker.related" data-key="id"><li data-text="text"></li></template></ul></div>
                  <div data-percepta-region="materiality"><h4>Materiality and status</h4><p data-text="an.blocker.state"></p></div>
                  <div data-percepta-region="blocked-capabilities"><h4>What waits on it</h4>
                    <template data-if="an.blocker.blocks.empty"><p class="causa-muted">No action is recorded as waiting on it.</p></template>
                    <ul class="causa-list" aria-label="Actions waiting on it"><template data-each="an.blocker.blocks" data-key="id"><li class="causa-item"><p data-text="text"></p><p class="causa-muted" data-text="state"></p></li></template></ul></div>
                </div>
                <div data-percepta-region="resolution-path"><h4>How it is resolved</h4><p data-text="an.blocker.path"></p>
                  <form class="ef-form causa-form" data-event="submit-ResolveUnknown" aria-labelledby="ru-heading">
                    <h5 id="ru-heading">Answer the open question</h5>
                    <div class="ef-field"><label class="ef-field__label" id="ru-basis-label" for="ru-basis">Basis for the answer</label>
                      <input id="ru-basis" aria-labelledby="ru-basis-label" class="causa-input" type="text" required data-event="field-ResolveUnknown.basis" data-on="input" data-bind-value="an.form.resolveUnknown.basis"></div>
                    <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="an.resolveUnknown.disabled" data-percepta-capability="ResolveUnknown" aria-describedby="an-resolveUnknown-reason">Mark answered</button>
                    <p class="causa-capability__reason" id="an-resolveUnknown-reason" data-percepta-unavailable-reason-for="ResolveUnknown" data-text="an.resolveUnknown.reason"></p>
                    <template data-if="an.resolveUnknown.hasBlocker"><a class="causa-related" data-bind-href="an.resolveUnknown.blockerHref" data-percepta-blocker-link-for="ResolveUnknown">See the open question</a></template>
                  </form>
                  <form class="ef-form causa-form" data-event="submit-ResolveContradiction" aria-labelledby="rc-heading">
                    <h5 id="rc-heading">Resolve the contradiction</h5>
                    <div class="ef-field"><label class="ef-field__label" id="rc-basis-label" for="rc-basis">Basis for the resolution</label>
                      <input id="rc-basis" aria-labelledby="rc-basis-label" class="causa-input" type="text" required data-event="field-ResolveContradiction.basis" data-on="input" data-bind-value="an.form.resolveContradiction.basis"></div>
                    <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="an.resolveContradiction.disabled" data-percepta-capability="ResolveContradiction" aria-describedby="an-resolveContradiction-reason">Mark resolved</button>
                    <p class="causa-capability__reason" id="an-resolveContradiction-reason" data-percepta-unavailable-reason-for="ResolveContradiction" data-text="an.resolveContradiction.reason"></p>
                    <template data-if="an.resolveContradiction.hasBlocker"><a class="causa-related" data-bind-href="an.resolveContradiction.blockerHref" data-percepta-blocker-link-for="ResolveContradiction">See the open question</a></template>
                  </form>
                </div>
              </section>
            </template>
            <div class="causa-overview-grid">
              <section class="causa-panel" aria-labelledby="ov-what" data-percepta-region="observation">
                <h3 id="ov-what">What happened</h3>
                <p class="causa-observation" data-text="inv.description"></p>
                <h4>Evidence</h4>
                <template data-if="evidence.empty"><p class="causa-muted">No evidence recorded yet.</p></template>
                <ul class="causa-list">
                  <template data-each="evidence" data-key="id">
                    <li class="causa-item causa-item--evidence"><p data-text="content"></p><p class="causa-muted"><span data-text="category"></span> · <span data-text="source"></span></p></li>
                  </template>
                </ul>
              </section>
              <section class="causa-panel" aria-labelledby="ov-hyp" data-percepta-region="hypotheses">
                <h3 id="ov-hyp">Hypotheses</h3>
                <template data-if="hypotheses.empty"><p class="causa-muted">No hypotheses recorded yet.</p></template>
                <ul class="causa-list">
                  <template data-each="hypotheses" data-key="id">
                    <li class="causa-item causa-item--hypothesis"><p data-text="statement"></p><p><span class="causa-tag" data-bind-data-tone="tone" data-text="state"></span> <span class="causa-muted"><span data-text="supporting"></span>, <span data-text="contradicting"></span></span></p></li>
                  </template>
                </ul>
              </section>
              <section class="causa-panel" aria-labelledby="ov-open" data-percepta-region="blockers">
                <h3 id="ov-open">Open questions</h3>
                <template data-if="blockers.empty"><p class="causa-muted">No open questions recorded.</p></template>
                <ul class="causa-list">
                  <template data-each="blockers" data-key="id">

                  <div data-percepta-region="current-version"><h4>Where the replay is</h4><p role="status" data-text="an.replay.version"></p></div>
                  <div data-percepta-region="hypotheses"><h4>Hypotheses at this point</h4>
                    <template data-if="an.replay.hypotheses.empty"><p class="causa-muted">No hypothesis had been recorded yet.</p></template>
                <ul class="causa-list" aria-label="Hypotheses at this version"><template data-each="an.replay.hypotheses" data-key="id"><li class="causa-item"><p data-text="text"></p><p class="causa-muted" data-text="state"></p></li></template></ul></div>
                  <div data-percepta-region="event-step"><h4>This step</h4><p data-text="an.replay.event"></p>
                    <ul class="causa-diff"><template data-each="an.replay.changes" data-key="id"><li data-text="text"></li></template></ul>
                    <p><template data-if="an.replay.hasPrev"><a class="causa-related" data-bind-href="an.replay.prevHref">Previous step</a></template>
                    <template data-if="an.replay.hasNext"><a class="causa-related" data-bind-href="an.replay.nextHref">Next step</a></template></p></div>
                  <div data-percepta-region="next-action"><h4>What comes next</h4><p data-text="an.replay.next"></p></div>
                </div>
              </section>
            </template>
            <p><a class="causa-related" data-bind-href="an.replay.startHref">Replay from the first event</a></p>
            <p class="causa-panel causa-history-label" data-percepta-region="version-state" data-bind-data-historical="history.historical" role="status" data-text="timeline.version"></p>
            <div class="causa-history-controls">
              <div class="ef-field causa-filter">
                <label class="ef-field__label" id="history-version-label" for="history-version">Show the investigation as it was at</label>
                <select id="history-version" aria-labelledby="history-version-label" class="causa-input" data-event="history-version" data-bind-value="history.version">
                  <option value="">The latest version</option>
                  <template data-each="history.versions" data-key="id"><option data-bind-value="value" data-text="label"></option></template>
                </select>
              </div>
              <div class="ef-field causa-filter">
                <label class="ef-field__label" id="timeline-filter-label" for="timeline-filter">Show events about</label>
                <select id="timeline-filter" aria-labelledby="timeline-filter-label" class="causa-input" data-event="timeline-filter" data-bind-value="timeline.filter">
                  <template data-each="timeline.categories" data-key="id"><option data-bind-value="value" data-text="label"></option></template>
                </select>
              </div>
            </div>
            <template data-if="history.show">
              <section class="causa-panel causa-history" aria-labelledby="history-heading" data-bind-data-historical="history.historical">
                <h3 id="history-heading">State at the chosen version</h3>
                <p data-percepta-region="versions" data-text="an.diff.versions"></p>
                <p><span class="causa-label">Title:</span> <span data-text="history.title"></span> · <span class="causa-label">Status:</span> <span data-text="history.status"></span></p>
                <ul class="causa-inline-list"><template data-each="history.counts" data-key="id"><li data-text="text"></li></template></ul>
                <div data-percepta-region="entity-changes">
                <h4>What this version changed</h4>
                <template data-if="history.hereEmpty"><p class="causa-muted">No semantic change is recorded for this version.</p></template>
                <ul class="causa-diff"><template data-each="history.here" data-key="id"><li data-text="text"></li></template></ul>
                <template data-if="history.sinceShow"><div>
                  <h4>Changed since, up to the latest version</h4>
                  <ul class="causa-diff"><template data-each="history.since" data-key="id"><li data-text="text"></li></template></ul>
                  <p><a class="causa-related" data-bind-href="history.latestHref">Back to the latest version</a></p>
                </div></template>
                </div>
                <div data-percepta-region="blocker-changes">
                  <h4>Open questions that changed since</h4>
                  <template data-if="an.diff.blockers.empty"><p class="causa-muted">No open question was opened or answered between this version and the latest.</p></template>
                  <ul class="causa-diff-gates"><template data-each="an.diff.blockers" data-key="id"><li data-text="text"></li></template></ul>
                </div>
                <div data-percepta-region="capability-changes">
                  <h4>Actions whose availability changed since</h4>
                  <template data-if="an.diff.capabilities.empty"><p class="causa-muted">No action's availability differs between this version and the latest.</p></template>
                  <ul class="causa-diff-gates"><template data-each="an.diff.capabilities" data-key="id"><li data-text="text"></li></template></ul>
                </div>
              </section>
            </template>
            <p class="causa-panel" data-percepta-region="policy-version">Policy version: not recorded for this investigation.</p>
            <p class="causa-panel" data-percepta-region="replay" data-text="timeline.replay"></p>
            <div data-percepta-region="timeline">
              <template data-if="timeline.empty"><p class="causa-muted">No recorded events.</p></template>
              <ol class="causa-timeline">
                <template data-each="timeline" data-key="id">
                  <li class="causa-timeline__entry" data-bind-data-current="current" data-bind-data-selected="selected" tabindex="-1">
                    <a data-bind-href="versionHref" data-text="sequence"></a>
                    <span class="causa-timeline__type" data-text="type"></span>
                    <span data-text="occurred"></span>
                    <span class="causa-muted" data-text="recorded"></span>
                    <span class="causa-muted" data-text="actor"></span>
                    <template data-if="clockNote"><span class="causa-tag" data-tone="attention">Clock earlier than a previous event; ordered by sequence</span></template>
                    <template data-if="hasAffected"><a class="causa-related" data-bind-href="affectedHref" data-text="affectedText"></a></template>
                    <a class="causa-details" data-bind-href="eventHref" data-bind-aria-label="eventLabel">Details</a>
                  </li>
                </template>
              </ol>
            </div>
          </section>
        </template>
        <template data-if="section.corrective">
          <div>
          <template data-if="an.corr.action">
          <section aria-labelledby="sec-corrective" data-percepta-screen="investigation-corrective-actions">
            <h2 id="sec-corrective">Corrective actions</h2>
            <template data-if="corrections.empty"><p class="causa-muted">No corrective action recorded yet.</p></template>
            <ul class="causa-list">
              <template data-each="ux.corrections" data-key="id"><li class="causa-item causa-item--correction" data-bind-data-selected="selected" tabindex="-1"><p data-text="text"></p><p class="causa-muted"><span data-text="kind"></span> · <span data-text="state"></span> · <span data-text="verification"></span></p><p><a class="causa-details" data-bind-href="href" data-bind-aria-label="detailsLabel">Details</a></p></li></template>
            </ul>
            <div class="causa-overview-grid">
              <section class="causa-panel" aria-labelledby="ca-action" data-percepta-region="action">
                <h3 id="ca-action">Corrective action</h3>
                <p data-text="an.ca.description"></p>
                <template data-if="an.ca.any"><p class="causa-muted" data-text="an.ca.state"></p></template>
                <ul class="causa-capabilities">
                  <template data-each="an.markImplemented" data-key="id">
                    <li>
                      <template data-if="legal">
                        <button type="button" class="ef-button" data-ef-variant="primary" data-event="command" data-bind-data-percepta-capability="name" data-text="label"></button>
                      </template>
                      <template data-if="illegal"><div class="causa-capability">
                        <button type="button" class="ef-button" disabled data-bind-data-percepta-capability="name" data-bind-aria-describedby="reasonId" data-text="label"></button>
                        <p class="causa-capability__reason" data-bind-id="reasonId" data-bind-data-percepta-unavailable-reason-for="name" data-text="reason"></p>
                        <template data-if="hasBlocker"><a class="causa-related" data-bind-href="blockerHref" data-bind-data-percepta-blocker-link-for="name">See the open question</a></template>
                      </div></template>
                    </li>
                  </template>
                </ul>
                <ul class="causa-inline-list" aria-label="Other corrective actions"><template data-each="an.ca.others" data-key="id"><li><a data-bind-href="href" data-text="text"></a></li></template></ul>
              </section>
              <section class="causa-panel" aria-labelledby="ca-class" data-percepta-region="classification">
                <h3 id="ca-class">Classification</h3>
                <p data-text="an.ca.kind"></p>
              </section>
              <section class="causa-panel" aria-labelledby="ca-target" data-percepta-region="target-cause">
                <h3 id="ca-target">Target cause</h3>
                <template data-if="an.ca.targets.empty"><p class="causa-muted">No cause is named for this corrective action.</p></template>
                <ul class="causa-list" aria-label="Causes addressed"><template data-each="an.ca.targets" data-key="id"><li data-text="text"></li></template></ul>
              </section>
              <section class="causa-panel" aria-labelledby="ca-criteria" data-percepta-region="verification-criteria">
                <h3 id="ca-criteria">Verification criteria</h3>
                <template data-if="an.ca.criteria.empty"><p class="causa-muted">No verification criterion is recorded, so nothing about its effect is verified.</p></template>
                <ul class="causa-list" aria-label="Verification criteria"><template data-each="an.ca.criteria" data-key="id"><li><a data-bind-href="href" data-text="text"></a> <span class="causa-muted" data-text="state"></span></li></template></ul>
              </section>
            </div>
            <form class="ef-form causa-form causa-panel" data-event="submit-RecordCorrectiveAction" aria-labelledby="ca-form-heading">
              <h3 id="ca-form-heading">Record a corrective action</h3>
              <div class="ef-field"><label class="ef-field__label" id="ca-description-label" for="ca-description">What will be done</label>
                <input id="ca-description" aria-labelledby="ca-description-label" class="causa-input" type="text" required data-event="field-RecordCorrectiveAction.description" data-on="input" data-bind-value="form.ca.description"></div>
              <div class="causa-form__row">
                <div class="ef-field"><label class="ef-field__label" id="ca-kind-label" for="ca-kind">Kind</label>
                  <select id="ca-kind" aria-labelledby="ca-kind-label" class="causa-input" data-event="field-RecordCorrectiveAction.kind">
                    <option value="correction">Correction of the cause</option><option value="mitigation">Mitigation</option><option value="workaround">Workaround</option><option value="prevention">Prevention</option>
                  </select></div>
                <div class="ef-field"><label class="ef-field__label" id="ca-cause-label" for="ca-cause">Cause it addresses</label>
                  <select id="ca-cause" aria-labelledby="ca-cause-label" class="causa-input" data-event="field-RecordCorrectiveAction.cause">
                    <option value="">Choose a cause</option>
                    <template data-each="causeOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select></div>
              </div>
              <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="an.ca.disabled" data-percepta-capability="RecordCorrectiveAction" aria-describedby="an-ca-reason">Record</button>
              <p class="causa-capability__reason" id="an-ca-reason" data-percepta-unavailable-reason-for="RecordCorrectiveAction" data-text="an.ca.reason"></p>
              <template data-if="an.ca.hasBlocker"><a class="causa-related" data-bind-href="an.ca.blockerHref" data-percepta-blocker-link-for="RecordCorrectiveAction">See the open question</a></template>
            </form>
          </section>
          </template>
          <!-- Verification (S13): one criterion, its expected outcome, what was recorded and the evidence cited. -->
          <template data-if="an.corr.verification">
          <section aria-labelledby="sec-verification" data-percepta-screen="verification">
            <h2 id="sec-verification">Verification</h2>
            <p><a class="causa-back" data-bind-href="an.cr.backHref">Back to the corrective action</a></p>
            <div class="causa-overview-grid">
              <section class="causa-panel" aria-labelledby="vf-criteria" data-percepta-region="criteria">
                <h3 id="vf-criteria">Criteria for this corrective action</h3>
                <ul class="causa-list" aria-label="Criteria"><template data-each="an.cr.all" data-key="id"><li data-bind-data-current="current"><a data-bind-href="href" data-text="text"></a> <span class="causa-muted" data-text="state"></span></li></template></ul>
              </section>
              <section class="causa-panel" aria-labelledby="vf-expected" data-percepta-region="expected-outcome">
                <h3 id="vf-expected">Expected outcome</h3>
                <p data-text="an.cr.expected"></p>
                <p class="causa-muted" data-text="an.cr.method"></p>
              </section>
              <section class="causa-panel" aria-labelledby="vf-actual" data-percepta-region="actual-result">
                <h3 id="vf-actual">Recorded results</h3>
                <template data-if="an.cr.results.empty"><p class="causa-muted">No result is recorded for this criterion; it is not verified.</p></template>
                <ul class="causa-list" aria-label="Recorded results"><template data-each="an.cr.results" data-key="id"><li data-text="text"></li></template></ul>
              </section>
              <section class="causa-panel" aria-labelledby="vf-evidence" data-percepta-region="evidence">
                <h3 id="vf-evidence">Evidence cited</h3>
                <template data-if="an.cr.evidence.empty"><p class="causa-muted">No evidence is cited for this criterion yet.</p></template>
                <ul class="causa-list" aria-label="Evidence cited by the results"><template data-each="an.cr.evidence" data-key="id"><li class="causa-item"><p data-text="text"></p><p class="causa-muted" data-text="state"></p></li></template></ul>
              </section>
            </div>
            <form class="ef-form causa-form causa-panel" data-event="submit-RecordVerification" aria-labelledby="vf-form-heading">
              <h3 id="vf-form-heading">Record a verification result</h3>
              <div class="causa-form__row">
                <div class="ef-field"><label class="ef-field__label" id="vf-outcome-label" for="vf-outcome">Outcome</label>
                  <select id="vf-outcome" aria-labelledby="vf-outcome-label" class="causa-input" data-event="field-RecordVerification.outcome">
                    <option value="inconclusive">Inconclusive</option><option value="satisfied">Criterion satisfied</option><option value="failed">Criterion not met</option>
                  </select></div>
                <div class="ef-field"><label class="ef-field__label" id="vf-ev-label" for="vf-ev">Evidence</label>
                  <select id="vf-ev" aria-labelledby="vf-ev-label" class="causa-input" data-event="field-RecordVerification.evidence">
                    <option value="">Choose evidence</option>
                    <template data-each="evidence" data-key="id"><option data-bind-value="id" data-text="content"></option></template>
                  </select></div>
              </div>
              <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="an.verify.disabled" data-percepta-capability="RecordVerification" aria-describedby="an-verify-reason">Record the result</button>
              <p class="causa-capability__reason" id="an-verify-reason" data-percepta-unavailable-reason-for="RecordVerification" data-text="an.verify.reason"></p>
              <template data-if="an.verify.hasBlocker"><a class="causa-related" data-bind-href="an.verify.blockerHref" data-percepta-blocker-link-for="RecordVerification">See the open question</a></template>
            </form>
          </section>
          </template>
          </div>
        </template>
        <template data-if="section.proposals">
          <section aria-labelledby="sec-proposals" data-percepta-screen="investigation-proposals">
            <h2 id="sec-proposals">AI proposals</h2>
            <p class="causa-muted">An AI assistant can only propose hypotheses, open questions or actions. Nothing it proposes changes the investigation until you accept it.</p>
            <template data-if="ai.noKey"><p class="causa-notice" data-tone="warning">Enter your provider key in <a href="#/settings">Settings</a> to request proposals.</p></template>
            <template data-if="ai.noModel"><p class="causa-notice" data-tone="warning">Set the AI model id in <a href="#/settings">Settings</a>; there is no default model.</p></template>
            <form class="ef-form causa-form" data-event="ai-request">
              <div class="ef-field">
                <label class="ef-field__label" id="ai-task-label" for="ai-task">What should the assistant propose?</label>
                <textarea id="ai-task" aria-labelledby="ai-task-label" class="causa-input" rows="2" required data-event="ai-task" data-on="input" data-bind-value="draft.aiTask"></textarea>
              </div>
              <button type="submit" class="ef-button" data-ef-variant="primary" data-bind-disabled="ai.requestDisabled">Request proposals</button>
            </form>
            <template data-if="ai.inFlight"><div class="causa-ai-status" role="status"><p>Waiting for the provider…</p><button type="button" class="ef-button" data-event="ai-cancel">Cancel the request</button></div></template>
            <template data-if="ai.result.show"><div class="ef-alert causa-notice" role="status" data-bind-data-tone="ai.result.tone"><p class="causa-notice__text" data-text="ai.result.text"></p>
              <template data-if="ai.retryable"><button type="button" class="ef-button" data-event="ai-retry">Try again</button></template></div></template>
            <template data-if="ai.hasDrafts">
              <section class="causa-panel" aria-labelledby="ai-drafts-heading">
                <h3 id="ai-drafts-heading">Drafted proposals (not recorded)</h3>
                <template data-if="ai.stale.show"><p class="causa-notice causa-stale" data-tone="warning" data-text="ai.stale.text"></p></template>
                <ul class="causa-list">
                  <template data-each="ai.drafts" data-key="id">
                    <li class="causa-item causa-item--proposal"><p><span class="causa-tag" data-text="kind"></span> <span data-text="text"></span></p><p class="causa-muted" data-text="rationale"></p></li>
                  </template>
                </ul>
                <p><button type="button" class="ef-button" data-ef-variant="primary" data-event="ai-record">Record as proposals for review</button> <button type="button" class="ef-button" data-event="ai-discard">Discard drafts</button></p>
              </section>
            </template>
            <h3>Proposals awaiting a decision and decided</h3>
            <template data-if="proposals.empty"><p class="causa-muted">No proposals have been recorded.</p></template>
            <ul class="causa-list">
              <template data-each="proposals" data-key="id">
                <li class="causa-item causa-item--proposal">
                  <p><span class="causa-tag" data-text="kind"></span> <span data-text="text"></span></p>
                  <p class="causa-muted" data-text="rationale"></p>
                  <p class="causa-muted"><span data-text="by"></span> · <strong data-text="state"></strong></p>
                  <template data-if="canAccept"><button type="button" class="ef-button" data-ef-variant="primary" data-event="proposal-accept" data-percepta-capability="AcceptProposal">Accept</button></template>
                  <template data-if="canReject"><div class="causa-capability causa-capability--input">
                    <label class="ef-field__label" data-bind-id="reasonLabelId" data-bind-for="reasonInputId">Why it is rejected</label>
                    <input class="causa-input" type="text" autocomplete="off" data-bind-id="reasonInputId" data-bind-aria-labelledby="reasonLabelId" data-event="proposal-reason" data-on="input" data-bind-value="reasonValue">
                    <button type="button" class="ef-button" data-event="proposal-reject" data-percepta-capability="RejectProposal">Reject</button>
                  </div></template>
                  <template data-if="acceptBlocked"><p class="causa-capability__reason" data-text="acceptWhy"></p></template>
                </li>
              </template>
            </ul>
          </section>
        </template>
        <template data-if="section.report">
          <section aria-labelledby="sec-report" data-percepta-screen="investigation-report">
            <h2 id="sec-report">Report</h2>
            <p><button type="button" class="ef-button" id="causa-print">Print the report</button></p>
            <template data-if="report.incomplete"><p class="causa-report__incomplete" role="status" data-text="report.status"></p></template>
            <ef-print-document class="causa-panel causa-report-preview causa-report">
              <ef-print-title-page class="causa-report__title-page">
                <p class="causa-report__eyebrow">Causa investigation report</p>
                <p class="causa-report__title" data-text="inv.title"></p>
                <p data-text="report.status"></p>
              </ef-print-title-page>
              <ef-print-section aria-labelledby="rp-source" data-percepta-region="source-version"><h3 id="rp-source">Source</h3><p data-text="report.source"></p></ef-print-section>
              <ef-print-section aria-labelledby="rp-conclusion" data-percepta-region="conclusion"><h3 id="rp-conclusion">Conclusion</h3><p data-text="report.conclusion"></p>
                <template data-if="report.hasCauses"><div><h4>Causal relationships</h4><ul class="causa-report__list">
                  <template data-each="report.causes" data-key="id"><li><span data-text="outcome"></span> — <strong data-text="state"></strong>. <span data-text="members"></span></li></template>
                </ul></div></template>
              </ef-print-section>
              <ef-print-section aria-labelledby="rp-evidence" data-percepta-region="evidence"><h3 id="rp-evidence">Evidence</h3>
                <template data-if="evidence.empty"><p class="causa-muted">No evidence recorded yet.</p></template>
                <ul class="causa-report__list">
                  <template data-each="evidence" data-key="id"><li><span data-text="content"></span> (<span data-text="source"></span>)</li></template>
                </ul>
              </ef-print-section>
              <ef-print-section aria-labelledby="rp-uncertainty" data-percepta-region="uncertainty"><h3 id="rp-uncertainty">Open questions</h3>
                <template data-if="report.noOpen"><p class="causa-muted">No open question, contradiction or unverified assumption is recorded.</p></template>
                <ul class="causa-report__list">
                  <template data-each="report.open" data-key="id"><li data-text="text"></li></template>
                </ul>
              </ef-print-section>
              <ef-print-section aria-labelledby="rp-verification" data-percepta-region="verification"><h3 id="rp-verification">Verification</h3><p data-text="report.verification"></p>
                <ul class="causa-report__list"><template data-each="report.corrections" data-key="id"><li><span data-text="text"></span>: <strong data-text="state"></strong></li></template></ul>
              </ef-print-section>
            </ef-print-document>
          </section>
        </template>

        <!-- The detail inspector (stream ux, UI-034, UI-005): one typed contract for every selected record, composed
             from Forma's record header, key-value list and relationship index. -->
        <template data-if="inspector.show">
          <aside class="causa-inspector ef-surface ef-master-detail__detail" aria-labelledby="inspector-heading" data-percepta-region="inspector" tabindex="-1" data-bind-data-selected="inspector.selected">
            <header class="ef-record-header">
              <div class="ef-record-header__main">
                <div class="ef-record-header__title">
                  <div><span class="ef-record-header__type" data-text="inspector.kind"></span><h2 id="inspector-heading" data-text="inspector.heading"></h2></div>
                  <span class="ef-status-lozenge causa-inspector__state" data-text="inspector.state"></span>
                </div>
              </div>
              <div class="ef-record-header__actions"><a class="ef-button causa-link-button causa-inspector__close" data-bind-href="inspector.close">Close details</a></div>
            </header>
            <dl class="ef-key-value-list causa-inspector__fields">
              <template data-each="inspector.fields" data-key="id">
                <div data-bind-data-missing="missing"><dt data-text="label"></dt><dd data-text="value"></dd></div>
              </template>
            </dl>
            <template data-if="inspector.hasUrl"><p><a class="causa-inspector__artifact" data-bind-href="inspector.url" rel="noopener noreferrer" target="_blank">Open the original artifact</a></p></template>
            <section class="ef-relationship-index causa-inspector__links" aria-labelledby="inspector-links">
              <header><h3 id="inspector-links">Related records</h3></header>
              <dl class="ef-relationship-index__list">
                <template data-each="inspector.links" data-key="id">
                  <div><dt data-text="group"></dt><dd>
                    <template data-if="link"><a data-bind-href="href" data-text="text"></a> <span class="causa-muted" data-text="relation"></span></template>
                    <template data-if="absent"><span class="causa-absent" data-text="text"></span></template>
                  </dd></div>
                </template>
              </dl>
            </section>
            <template data-if="inspector.explained">
              <section class="causa-inspector__why" aria-labelledby="inspector-why">
                <h3 id="inspector-why">Why it stands where it does</h3>
                <ul class="causa-list"><template data-each="inspector.explanation" data-key="id"><li data-text="text"></li></template></ul>
              </section>
            </template>
          </aside>
        </template>
        <template data-if="inspector.unknown">
          <p class="causa-muted causa-inspector__missing" role="status">The selected record is not part of this investigation.</p>
        </template>
      </div>
    </template>

    <!-- Administration (UI-018, VER-007): read-only system information. -->
    <template data-if="screen.admin">
      <section aria-labelledby="admin-heading" data-percepta-screen="administration">
        <h1 id="admin-heading" data-percepta-observation="desktop-reference-semantic-priority">Administration</h1>
        <p class="causa-muted" data-percepta-observation="ipad-portrait-semantic-priority">System information and diagnostics for this build. Read-only. Tokens are never shown.</p>
        <p><a class="causa-related" href="#/administration/proof">Requirements proof</a> · <a class="causa-related" href="#/administration/factory">How this build was made</a></p>
        <div class="causa-attention" data-tone="attention" data-percepta-observation="desktop-reference-blocked-state">
          <strong data-percepta-observation="narrow-phone-blocked-state">Readiness:</strong>
          <span data-text="admin.readiness" data-percepta-observation="no-false-authority"></span>
          <ul class="causa-admin-unverified" aria-label="Items not verified" data-percepta-observation="blocker-visible">
            <template data-each="admin.unverified" data-key="id"><li data-text="text"></li></template>
          </ul>
          <span data-percepta-observation="ipad-portrait-blocked-state">Each section below lists its items with their state.</span>
          <span data-percepta-observation="ipad-landscape-blocked-state">Smoke-test results are recorded by CI, not observed here.</span>
        </div>
        <section class="causa-panel" aria-labelledby="adm-deployment" data-percepta-region="deployment">
          <h2 id="adm-deployment">Deployment</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.deployment" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <section class="causa-panel" aria-labelledby="adm-persistence" data-percepta-region="persistence">
          <h2 id="adm-persistence">Data and persistence</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.persistence" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <section class="causa-panel" aria-labelledby="adm-ai" data-percepta-region="ai">
          <h2 id="adm-ai">AI assistance</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.ai" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <section class="causa-panel" aria-labelledby="adm-report" data-percepta-region="report">
          <h2 id="adm-report">Report</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.report" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <section class="causa-panel" aria-labelledby="adm-security" data-percepta-region="security">
          <h2 id="adm-security">Security</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.security" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <section class="causa-panel" aria-labelledby="adm-smoke-tests" data-percepta-region="smoke-tests">
          <h2 id="adm-smoke-tests">Smoke tests</h2>
          <table class="causa-admin">
            <thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">State</th></tr></thead>
            <tbody>
              <template data-each="admin.smoke" data-key="id">
                <tr><th scope="row" data-text="label"></th><td data-text="value"></td><td data-text="state"></td></tr>
              </template>
            </tbody>
          </table>
        </section>
        <p class="causa-muted" data-percepta-observation="ipad-landscape-semantic-priority">Unknown means not observed by this page; Unavailable means it could not be read or is not part of this build.</p>
        <p class="causa-muted" data-percepta-observation="narrow-phone-semantic-priority">Nothing on this page changes an investigation.</p>
      </section>
    </template>

    <!-- Requirements proof (S21): what proves each requirement, from evidence published with this build. -->
    <template data-if="proof.show">
      <section aria-labelledby="proof-heading" data-percepta-screen="requirements-proof">
        <p><a class="causa-back" href="#/administration">Administration</a></p>
        <h1 id="proof-heading" data-percepta-observation="desktop-reference-semantic-priority">Requirements proof</h1>
        <p class="causa-muted" data-percepta-observation="ipad-portrait-semantic-priority">Each requirement with the obligations it must meet and the tests that prove them, read from the evidence published with this build. What is not proven is shown as not proven.</p>
        <template data-if="proof.loading"><p role="status" class="causa-muted">Reading the published evidence…</p></template>
        <template data-if="proof.failed"><p class="ef-alert causa-notice" data-tone="danger" role="alert" data-text="proof.failure"></p></template>
        <div class="causa-attention" data-tone="attention" data-percepta-observation="desktop-reference-blocked-state">
          <strong data-percepta-observation="narrow-phone-blocked-state">Proof status:</strong>
          <span data-text="proof.summary" data-percepta-observation="ipad-portrait-blocked-state"></span>
          <span class="causa-attention__blocked" data-text="proof.notProven" data-percepta-observation="no-false-authority"></span>
          <span data-text="proof.req.status" data-percepta-observation="blocker-visible"></span>
          <span class="causa-muted" data-percepta-observation="ipad-landscape-blocked-state">A requirement counts as proven only when every one of its obligations has a passing test.</span>
        </div>
        <section class="causa-panel" aria-labelledby="proof-req-heading" data-percepta-region="requirement">
          <h2 id="proof-req-heading" data-text="proof.req.title" data-percepta-observation="ipad-landscape-semantic-priority"></h2>
          <div class="ef-field causa-filter">
            <label class="ef-field__label" id="proof-pick-label" for="proof-pick">Requirement</label>
            <select id="proof-pick" aria-labelledby="proof-pick-label" class="causa-input" data-event="proof-pick" data-bind-value="proof.selected">
              <template data-each="proof.requirements" data-key="id"><option data-bind-value="value" data-text="label"></option></template>
            </select>
          </div>
          <p><span class="causa-tag" data-bind-data-tone="proof.req.tone" data-text="proof.req.status" data-percepta-observation="narrow-phone-semantic-priority"></span> <span class="causa-muted" data-text="proof.req.priority"></span></p>
        </section>
        <section class="causa-panel" aria-labelledby="proof-scn-heading" data-percepta-region="scenario">
          <h2 id="proof-scn-heading">Obligations</h2>
          <ul class="causa-list">
            <template data-each="proof.obligations" data-key="id">
              <li class="causa-item"><p><strong data-text="source"></strong> <span data-text="text"></span></p><p class="causa-label" data-text="status"></p><p class="causa-muted" data-text="tests"></p></li>
            </template>
          </ul>
        </section>
        <p class="causa-panel" data-percepta-region="work-item"><span class="causa-label">Work item:</span> <span data-text="proof.workItem"></span></p>
        <p class="causa-panel" data-percepta-region="source"><span class="causa-label">Source:</span> <span data-text="proof.source"></span></p>
        <p class="causa-panel" data-percepta-region="test"><span class="causa-label">Tests:</span> listed with each obligation above, with their suite and outcome.</p>
        <p class="causa-panel" data-percepta-region="commit"><span class="causa-label">Commit:</span> <span data-text="proof.commit"></span></p>
        <p class="causa-panel" data-percepta-region="runtime-evidence"><span class="causa-label">Runtime evidence:</span> <span data-text="proof.runtime"></span></p>
      </section>
    </template>

    <!-- Factory view (S20): how this build was made and verified, every value read from published evidence. -->
    <template data-if="factory.show">
      <section aria-labelledby="factory-heading" data-percepta-screen="factory-view">
        <p><a class="causa-back" href="#/administration">Administration</a></p>
        <h1 id="factory-heading" data-percepta-observation="desktop-reference-semantic-priority">How this build was made</h1>
        <p class="causa-muted" data-percepta-observation="ipad-portrait-semantic-priority">Every value below is read from files published with this build. Anything not published is said to be missing.</p>
        <template data-if="factory.loading"><p role="status" class="causa-muted">Reading the published evidence…</p></template>
        <template data-if="factory.failed"><p class="ef-alert causa-notice" data-tone="danger" role="alert" data-text="factory.failure"></p></template>
        <div class="causa-attention" data-tone="attention" data-percepta-observation="desktop-reference-blocked-state">
          <strong data-percepta-observation="narrow-phone-blocked-state">Verification:</strong>
          <span data-text="factory.requirements" data-percepta-observation="blocker-visible"></span>
          <span class="causa-attention__blocked" data-percepta-observation="no-false-authority">Not-proven requirements are counted as not proven, never as passed.</span>
          <span data-text="factory.tests" data-percepta-observation="ipad-portrait-blocked-state"></span>
          <a class="causa-related" href="#/administration/proof" data-percepta-observation="ipad-landscape-blocked-state">See the requirements proof</a>
        </div>
        <section class="causa-panel" aria-labelledby="f-ros" data-percepta-region="ros">
          <h2 id="f-ros" data-percepta-observation="ipad-landscape-semantic-priority">Work (ROS)</h2>
          <p data-text="factory.ros.summary" data-percepta-observation="narrow-phone-semantic-priority"></p>
          <ul class="causa-list"><template data-each="factory.ros.items" data-key="id"><li class="causa-item" data-text="text"></li></template></ul>
        </section>
        <section class="causa-panel" aria-labelledby="f-req" data-percepta-region="requirements"><h2 id="f-req">Requirements</h2><p data-text="factory.requirements"></p></section>
        <section class="causa-panel" aria-labelledby="f-tests" data-percepta-region="tests"><h2 id="f-tests">Tests</h2><p data-text="factory.tests"></p></section>
        <section class="causa-panel" aria-labelledby="f-praxis" data-percepta-region="praxis"><h2 id="f-praxis">Praxis</h2><p data-text="factory.praxis"></p></section>
        <section class="causa-panel" aria-labelledby="f-aegis" data-percepta-region="aegis"><h2 id="f-aegis">Aegis</h2><p data-text="factory.aegis"></p></section>
        <section class="causa-panel" aria-labelledby="f-deploy" data-percepta-region="deployment"><h2 id="f-deploy">Deployment</h2><p data-text="factory.deployment"></p></section>
      </section>
    </template>

    <!-- Settings (UI-019): session-scope preferences only. -->
    <template data-if="screen.settings">
      <section aria-labelledby="settings-heading" data-percepta-screen="settings">
        <h1 id="settings-heading" data-percepta-observation="desktop-reference-semantic-priority">Settings</h1>
        <h2 id="manifest-heading" data-percepta-observation="ipad-portrait-semantic-priority">What governs investigations here</h2>
        <div class="causa-attention" data-tone="attention" data-percepta-observation="desktop-reference-blocked-state">
          <strong data-percepta-observation="narrow-phone-blocked-state">Open questions:</strong>
          <span data-text="an.manifest.questions" data-percepta-observation="ipad-portrait-blocked-state"></span>
          <template data-if="an.manifest.material"><span class="causa-attention__question" data-text="an.manifest.first" data-percepta-observation="blocker-visible"></span></template>
          <span data-percepta-observation="no-false-authority">Nothing below is shown as verified unless the release records it.</span>
          <span data-percepta-observation="ipad-landscape-blocked-state">The versions below are fixed by this release.</span>
        </div>
        <div class="causa-overview-grid">
          <section class="causa-panel" aria-labelledby="mf-semantic" data-percepta-region="semantic-version"><h3 id="mf-semantic" data-percepta-observation="ipad-landscape-semantic-priority">Semantic version</h3><p data-text="an.manifest.semantic" data-percepta-observation="narrow-phone-semantic-priority"></p></section>
          <section class="causa-panel" aria-labelledby="mf-pack" data-percepta-region="domain-pack"><h3 id="mf-pack">Domain pack</h3><p data-text="an.manifest.pack"></p></section>
          <section class="causa-panel" aria-labelledby="mf-policy" data-percepta-region="policy"><h3 id="mf-policy">Policy</h3><p data-text="an.manifest.policy"></p>
            <ul class="causa-capabilities">
                  <template data-each="an.pin" data-key="id">
                    <li>
                      <template data-if="legal">
                        <button type="button" class="ef-button" data-ef-variant="primary" data-event="command" data-bind-data-percepta-capability="name" data-text="label"></button>
                      </template>
                      <template data-if="illegal"><div class="causa-capability">
                        <button type="button" class="ef-button" disabled data-bind-data-percepta-capability="name" data-bind-aria-describedby="reasonId" data-text="label"></button>
                        <p class="causa-capability__reason" data-bind-id="reasonId" data-bind-data-percepta-unavailable-reason-for="name" data-text="reason"></p>
                        <template data-if="hasBlocker"><a class="causa-related" data-bind-href="blockerHref" data-bind-data-percepta-blocker-link-for="name">See the open question</a></template>
                      </div></template>
                    </li>
                  </template>
                </ul>
          </section>
          <section class="causa-panel" aria-labelledby="mf-provider" data-percepta-region="provider"><h3 id="mf-provider">Providers</h3><p data-text="an.manifest.provider"></p><p data-text="an.manifest.ai"></p></section>
          <section class="causa-panel" aria-labelledby="mf-class" data-percepta-region="classification"><h3 id="mf-class">Classification</h3><p data-text="an.manifest.classification"></p></section>
        </div>
        <h2>Preferences</h2>
        <p class="causa-muted">These preferences apply to this browser tab for this session only. They are not stored.</p>
        <div class="ef-field causa-filter">
          <label class="ef-field__label" id="setting-text-size-label" for="setting-text-size">Text size</label>
          <select id="setting-text-size" aria-labelledby="setting-text-size-label" class="causa-input" data-event="text-size" data-bind-value="settings.textSize">
            <option value="standard">Standard</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="ef-field causa-filter">
          <label class="ef-field__label" id="setting-motion-label" for="setting-motion">Motion</label>
          <select id="setting-motion" aria-labelledby="setting-motion-label" class="causa-input" data-event="motion" data-bind-value="settings.motion">
            <option value="system">Follow the system setting</option>
            <option value="reduced">Reduce motion</option>
          </select>
        </div>
        <h2>AI assistance</h2>
        <p class="causa-muted">Proposals are requested with your own provider key and the model you name. Both apply to this tab for this session only.</p>
        <div class="ef-field causa-filter">
          <label class="ef-field__label" id="setting-ai-model-label" for="setting-ai-model">AI model id</label>
          <input id="setting-ai-model" aria-labelledby="setting-ai-model-label" class="causa-input" type="text" autocomplete="off" spellcheck="false" data-event="ai-model" data-on="input" data-bind-value="settings.aiModel" aria-describedby="setting-ai-model-help">
          <p id="setting-ai-model-help" class="ef-field__description">There is no default: requests are refused until you enter one.</p>
        </div>
        <form class="ef-form causa-form" data-event="ai-key-set" data-clear-secrets aria-describedby="ai-key-help">
          <div class="ef-field">
            <label class="ef-field__label" id="ai-key-label" for="ai-key">Provider key</label>
            <input id="ai-key" aria-labelledby="ai-key-label" class="causa-input" type="password" autocomplete="off" spellcheck="false" required data-event="ai-key">
            <p id="ai-key-help" class="ef-field__description">Kept in this page's memory only: never stored in the browser, never shown, logged or written anywhere. Reloading the page forgets it.</p>
          </div>
          <button type="submit" class="ef-button" data-ef-variant="primary">Use this key</button>
        </form>
        <p data-text="settings.aiKey"></p>
        <template data-if="ai.keyHeld"><button type="button" class="ef-button" data-event="ai-key-clear">Forget the key</button></template>
        <h2>Data repository connection</h2>
        <p data-text="settings.connection"></p>
      </section>
    </template>
  </main>
  <!-- Test build only: the Percepta state hook sends the injected state through this control (main.js). -->
  <input id="percepta-state" type="hidden" data-event="percepta-state">
</body>
</html>
